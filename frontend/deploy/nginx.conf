# C-15: servidor estatico de la SPA (nginx-unprivileged). Sin TLS ni dominios:
# HTTPS y hosts los resuelve el proxy de Easypanel (Traefik).
# Se copia a /etc/nginx/conf.d/default.conf (contexto server).
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Assets con hash de Vite: cache largo; si falta uno responde 404 (nunca index.html como JS/CSS).
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Fallback SPA para rutas del cliente (/agenda, /lista-espera/<token>, ...).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
