schema: spec-driven

# Project context — TP-Turnos-Odontologo (generado fase agents 2026-10-05)
context: |
  Tech stack: Python 3.12 + FastAPI 0.110+ + JWT Bearer + SQLAlchemy 2 async + PostgreSQL 16 + Redis 7 + Docker/Compose; React 18 + TypeScript 5 + Vite 5.
  Domain: consultorios odontológicos AR — cierra turno → clínica → cobro. Turnos/Agenda prioritario (Épica A+B).
  Arquitectura: monolito modular backend/app/{api,servicios,repos,modelos,esquemas,worker,tests} + SPA frontend/src/{features,shared,pages}. Deploy local Docker Compose (api+worker+postgres+redis).
  Restricciones 2026-10-05 (vinculantes): sede única (Sillon.sede texto); rol FK simple usuario.rol_id, 3 roles fijos admin/odontologo/secretaria, Dueño=alias Admin; pagos simulados efectivo|transferencia|tarjeta_simulada, AFIP/MP post-TP; OS ficticia "OS Ficticia Demo"; datos 100% ficticios (RN-GL-03 al escalar); espera 2h; plazo duro 12/10/2026; equipo 3.
  Invariantes DB: EXCLUDE USING gist anti-solapamiento por profesional/sillón (requiere btree_gist, C-01); sobreturno solo sobre_turno=true+motivo auditado; saldo CC derivado; recibos secuenciales sin huecos; cierre caja diario obligatorio; presupuesto nace de hallazgo FDI 11–48; soft-delete clínico/admin; JWT_EXPIRE_MIN=30; TZ=America/Argentina/Buenos_Aires.
  Convenciones: snake_case + type hints Python; Pydantic extra='forbid'; Annotated[..., Depends(...)] para auth/DB; async solo si todo es async no bloqueante; TS estricto sin any, componentes PascalCase; secrets solo env (.env.example versionado, .env no).
  Fuente de verdad: knowledge-base/ + CHANGES.md (12 changes, 6 gates, crítico C-01→C-02→C-03→C-04→C-05→C-09→C-10). Skills vía .atl/skill-registry.md (12 skills). Reglas duras en AGENTS.md/CLAUDE.md.
  We use conventional commits. No build/commit/push sin pedido explícito, sin co-autoría IA.

rules:
  proposal:
    - Respetar dependencias y GATES de CHANGES.md; citar archivos "Leer antes" de la KB
    - No proponer multi-sede, pagos reales, AFIP, ni datos reales en v1.0
  tasks:
    - Break tasks into chunks of max 2 hours
    - Toda task toca Postgres real para constraints EXCLUDE (nunca SQLite); freezegun para tiempos

operations:
  apply:
    guidance:
      - TDD RED→GREEN→REFACTOR obligatorio; resolver skills desde .atl/skill-registry.md
  archive:
    guidance:
      - Marcar [x] el change en CHANGES.md al archivar; verificar compose local + seed demo E2E en C-12
